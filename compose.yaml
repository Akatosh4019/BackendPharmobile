services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: PHARMADB
      APP_USER_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:1522:1521"
    volumes:
      - pharmasoft-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: PHARMADB
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/docker
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pharmasoft-oracle-data:
